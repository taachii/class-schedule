<!DOCTYPE html>
<html lang="pl">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Plan Zajęć – I Rok Lekarski | SUM Zabrze 2026/2027</title>
  <meta name="description"
    content="Harmonogram zajęć dla I roku kierunku lekarskiego, Wydział Nauk Medycznych w Zabrzu, Śląski Uniwersytet Medyczny, semestr zimowy 2026/2027." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap"
    rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
</head>

<body>
  <!-- HEADER -->
  <header class="site-header">
    <div class="header-inner">
      <div class="header-brand">
        <div class="header-logo">
          <!-- <svg width="36" height="36" viewBox="0 0 36 36" fill="none" xmlns="http://www.w3.org/2000/svg">
            <rect width="36" height="36" rx="10" fill="url(#logoGrad)" />
            <path d="M18 8v20M8 18h20" stroke="white" stroke-width="3" stroke-linecap="round" />
            <defs>
              <linearGradient id="logoGrad" x1="0" y1="0" x2="36" y2="36" gradientUnits="userSpaceOnUse">
                <stop stop-color="#4f8ef7" />
                <stop offset="1" stop-color="#7c3aed" />
              </linearGradient>
            </defs>
          </svg> -->
        </div>
        <div class="header-text">
          <h1 class="header-title">Plan Zajęć</h1>
          <p class="header-subtitle">I Rok Lekarski · SUM Zabrze · Semestr Zimowy 2026/2027</p>
        </div>
      </div>
      <div class="header-controls">
        <div class="view-toggle" id="viewToggle" role="group" aria-label="Wybór widoku">
          <button class="view-btn active" id="btnCalendar" data-view="calendar" aria-pressed="true">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <rect x="3" y="4" width="18" height="18" rx="2" />
              <path d="M16 2v4M8 2v4M3 10h18" />
            </svg>
            Kalendarz
          </button>
          <button class="view-btn" id="btnList" data-view="list" aria-pressed="false">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M8 6h13M8 12h13M8 18h13M3 6h.01M3 12h.01M3 18h.01" />
            </svg>
            Lista
          </button>
        </div>
      </div>
    </div>
  </header>

  <!-- GROUP TABS -->
  <nav class="group-nav" aria-label="Grupy dziekańskie">
    <div class="group-nav-inner">
      <div class="group-tabs" id="groupTabs" role="tablist">
        <button class="group-tab active" role="tab" data-group="GS1" id="tab-GS1" aria-selected="true"
          aria-controls="panel-GS1">GS 1</button>
        <button class="group-tab" role="tab" data-group="GS2" id="tab-GS2" aria-selected="false"
          aria-controls="panel-GS2">GS 2</button>
        <button class="group-tab" role="tab" data-group="GS3" id="tab-GS3" aria-selected="false"
          aria-controls="panel-GS3">GS 3</button>
        <button class="group-tab" role="tab" data-group="GS4" id="tab-GS4" aria-selected="false"
          aria-controls="panel-GS4">GS 4</button>
        <button class="group-tab" role="tab" data-group="GS5" id="tab-GS5" aria-selected="false"
          aria-controls="panel-GS5">GS 5</button>
        <button class="group-tab" role="tab" data-group="GS6" id="tab-GS6" aria-selected="false"
          aria-controls="panel-GS6">GS 6</button>
        <button class="group-tab" role="tab" data-group="GS7" id="tab-GS7" aria-selected="false"
          aria-controls="panel-GS7">GS 7</button>
        <button class="group-tab" role="tab" data-group="GS8" id="tab-GS8" aria-selected="false"
          aria-controls="panel-GS8">GS 8</button>
        <button class="group-tab" role="tab" data-group="GS9" id="tab-GS9" aria-selected="false"
          aria-controls="panel-GS9">GS 9</button>
        <button class="group-tab" role="tab" data-group="GS10" id="tab-GS10" aria-selected="false"
          aria-controls="panel-GS10">GS 10</button>
        <button class="group-tab" role="tab" data-group="GS11" id="tab-GS11" aria-selected="false"
          aria-controls="panel-GS11">GS 11</button>
        <button class="group-tab" role="tab" data-group="GS12" id="tab-GS12" aria-selected="false"
          aria-controls="panel-GS12">GS 12</button>
        <button class="group-tab gw-tab" role="tab" data-group="GW" id="tab-GW" aria-selected="false"
          aria-controls="panel-GW">GW (Wykłady)</button>
      </div>
    </div>
  </nav>

  <!-- MAIN CONTENT -->
  <main class="main-content">

    <!-- FILTER BAR -->
    <div class="filter-bar" id="filterBar">
      <div class="filter-bar-inner">
        <div class="filter-label">Filtruj przedmioty:</div>
        <div class="subject-filters" id="subjectFilters" role="group" aria-label="Filtry przedmiotów">
          <!-- Dynamically populated -->
        </div>
        <button class="filter-reset" id="filterReset">Pokaż wszystko</button>
      </div>
    </div>

    <!-- CALENDAR VIEW -->
    <div class="view-panel" id="view-calendar">
      <div class="calendar-nav" id="calendarNav">
        <button class="cal-nav-btn" id="prevMonth" aria-label="Poprzedni miesiąc">&#8592;</button>
        <h2 class="cal-month-title" id="calMonthTitle">Październik 2026</h2>
        <button class="cal-nav-btn" id="nextMonth" aria-label="Następny miesiąc">&#8594;</button>
      </div>
      <div class="calendar-grid-wrapper">
        <div class="calendar-grid" id="calendarGrid"></div>
      </div>
    </div>

    <!-- LIST VIEW -->
    <div class="view-panel hidden" id="view-list">
      <div class="list-groups" id="listGroups"></div>
    </div>

  </main>

  <!-- EVENT DETAIL MODAL -->
  <div class="modal-overlay" id="modalOverlay" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
    <div class="modal-card" id="modalCard">
      <button class="modal-close" id="modalClose" aria-label="Zamknij">&#10005;</button>
      <div class="modal-header" id="modalHeader">
        <div class="modal-type-badge" id="modalTypeBadge"></div>
        <h3 class="modal-title" id="modalTitle"></h3>
        <div class="modal-date" id="modalDate"></div>
      </div>
      <div class="modal-body" id="modalBody"></div>
    </div>
  </div>

  <!-- COMING SOON OVERLAY (for empty groups) -->
  <div class="coming-soon-overlay hidden" id="comingSoonOverlay">
    <div class="coming-soon-card">
      <div class="coming-soon-icon">📋</div>
      <h3>Dane w przygotowaniu</h3>
      <p>Plan zajęć dla tej grupy zostanie dodany wkrótce.</p>
    </div>
  </div>

  <script src="data.js"></script>
  <script src="app.js"></script>
</body>

</html>
